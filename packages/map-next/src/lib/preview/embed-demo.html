<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="modulepreload" href="/main.js" />
		<!-- CSS is auto-injected into Shadow DOM by teikei-loader.js for style isolation -->
		<style>
			body {
				margin: 0;
			}
		</style>
		<script
			type="module"
			src="/teikei-loader.js"
			data-js="/main.js"
			data-host="#teikei-app"
			data-theme="teikei"
		></script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="teikei-app"
			data-base-url="/karte#"
			data-country="DE"
			style="display: block; height: 100vh; min-height: 100vh"
			data-user-communication-locale="de-DE"
		></div>
	</body>
</html>
