<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="modulepreload" href="/main.js" />
	</head>
	<body data-sveltekit-preload-data="hover">
		<div
			id="teikei-app"
			data-base-url="/karte#"
			data-country="DE"
			data-display-locale="de-DE"
			data-user-communication-locale="de-DE"
			style="display: block"
		>
			<script>
				{
					__sveltekit_teikei = {
						base: new URL('.', location).pathname.slice(0, -1)
					};

					const host = document.currentScript.parentElement;
					const shadow = host.attachShadow({ mode: 'open' });

					const baseline = document.createElement('style');
					baseline.textContent = `
						:host {
							font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
								'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;
							font-size: 16px;
							line-height: 1.5;
							color: var(--foreground);
							background-color: var(--background);
							-webkit-font-smoothing: antialiased;
							-moz-osx-font-smoothing: grayscale;
						}
						*,
						*::before,
						*::after {
							box-sizing: border-box;
						}
					`;

					const css = document.createElement('link');
					css.rel = 'stylesheet';
					css.href = '/main.css';

					const mount = document.createElement('div');
					mount.id = 'teikei-app-shadow-root';
					mount.style.minHeight = '100vh';

					shadow.append(baseline, css, mount);

					import('/main.js').then((app) => {
						app.start(mount);
					});
				}
			</script>
		</div>
	</body>
</html>
