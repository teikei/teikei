<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Teikei Widgets Demo</title>
		<style>
			body {
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
				max-width: 800px;
				margin: 2rem auto;
				padding: 0 1rem;
			}

			h1 {
				color: #1f2937;
			}
		</style>
	</head>
	<body>
		<h1>Teikei Widget Demo</h1>

		<div class="demo-section">
			<h2>Search Widget</h2>
			<div id="search-widget"></div>
		</div>

		<script type="module">
			import { start } from '/search-widget.js';

			const host = document.getElementById('search-widget');
			const shadow = host.attachShadow({ mode: 'open' });

			const baseline = document.createElement('style');
			baseline.textContent = `
				:host {
					font-family: system-ui, -apple-system, sans-serif;
					font-size: 16px;
					line-height: 1.5;
				}
				*,
				*::before,
				*::after {
					box-sizing: border-box;
				}
			`;

			const css = document.createElement('link');
			css.rel = 'stylesheet';
			css.href = '/search-widget.css';

			const mount = document.createElement('div');
			mount.id = 'search-widget-shadow-root';

			shadow.append(baseline, css, mount);
			start(mount);

			// Optional: destroy the widget later
			// widget.destroy();
		</script>
	</body>
</html>
